name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: aeroprep_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aeroprep_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:ci-only-postgres-password@localhost:5432/aeroprep_ci?schema=public
      DIRECT_URL: postgresql://postgres:ci-only-postgres-password@localhost:5432/aeroprep_ci?schema=public
      NEXTAUTH_SECRET: ci-only-nextauth-secret-not-for-production-0123456789
      NEXTAUTH_URL: http://localhost:3000
      PAYMENT_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm test
